<div class="login-page">
  <div class="container">
    <div class="login-card">
      <div class="card-header">
        <div class="logo" (click)="backToHome()">
          <span class="material-icons logo-icon">home_repair_service</span>
          <span>HouseMate</span>
        </div>
        <h1>Expert Login</h1>
        <p>Sign in to manage your jobs and earnings</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <div class="input-with-prefix">
            <span class="prefix">+91</span>
            <input 
              type="tel" 
              class="form-control" 
              formControlName="phone" 
              placeholder="10-digit mobile number"
              maxlength="10"
            />
          </div>
          <div class="form-error" *ngIf="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched">
            Valid 10-digit mobile number is required
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-control" 
            formControlName="password" 
            placeholder="Enter your password"
          />
          <div class="form-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required
          </div>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          <span class="material-icons">error</span>
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
          <span class="material-icons" *ngIf="!isLoading">login</span>
          <span *ngIf="isLoading">Logging in...</span>
          <span *ngIf="!isLoading">Login</span>
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="register-link">
        <p>New to HouseMate? <a routerLink="/expert/register">Register as Expert</a></p>
      </div>

      <div class="customer-link">
        <p>Looking for services? <a routerLink="/customer/login">Customer Login</a></p>
      </div>
    </div>
  </div>
</div>
